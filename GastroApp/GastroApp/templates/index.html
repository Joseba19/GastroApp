<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <div class="navbar">
        <span class="logo">GastroApp</span>
        <input type="text" id="buscador" placeholder="Buscar recetas..." onkeyup="filtrar()">
        <div class="nav-links">
            <a href="/">Recetas</a>
            <a href="/nosotros">Sobre nosotros</a>
            <button onclick="abrirLogin()" id="btn-abrir">Entrar</button>
            <button onclick="cerrarSesion()" id="btn-salir" style="display:none;">Salir</button>
        </div>
    </div>
</header>

<div id="panel-login" class="panel-login">
    <h3>Iniciar sesion</h3>
    <input type="text" id="usuario" placeholder="Usuario">
    <input type="password" id="contraseña" placeholder="Contraseña">
    <p id="error-login"></p>
    <button onclick="entrar()">Entrar</button>
</div>

<div class="recetas" id="lista-recetas"></div>
<!-- Habiamos usado con anterioridad los menus modales, pero pedimos ayuda a la ia para que todo estuviese correcto -->
<div id="modal-receta" class="modal" style="display:none;">
    <div class="modal-contenido">
        <span class="cerrar" onclick="cerrarModal()">&times;</span>
        <img id="img-receta" src="" alt="">
        <h2 id="titulo-receta"></h2>
        <p id="desc-receta"></p>
        <p>Tiempo: <span id="tiempo-receta"></span> min</p>
        <p>Dificultad: <span id="dificultad-receta"></span></p>
        <h3>Ingredientes</h3>
        <ul id="lista-ingredientes"></ul>
        <h3>Pasos</h3>
        <ol id="lista-pasos"></ol>
    </div>
</div>

<script>
var recetas = [];

function abrirLogin() {
    document.getElementById("panel-login").classList.toggle("abierto");
}

function entrar() {
    var user = document.getElementById("usuario").value;
    var pass = document.getElementById("contraseña").value;

    fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username: user, password: pass})
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        if (data.success) {
            document.getElementById("panel-login").classList.remove("abierto");
            document.getElementById("btn-abrir").style.display = "none";
            document.getElementById("btn-salir").style.display = "inline-block";
        } else {
            document.getElementById("error-login").innerText = "Datos incorrectos";
            document.getElementById("error-login").style.display = "block";
        }
    });
}

function cerrarSesion() {
    document.getElementById("btn-abrir").style.display = "inline-block";
    document.getElementById("btn-salir").style.display = "none";
}

function cargar() {
    fetch("/recetas")
    .then(function(res) { return res.json(); })
    .then(function(data) {
        recetas = data;
        mostrar(data);
    });
}
// para el display de las tarjetas tuvimos que ayudarnos de un poco de IA para que diesen datos
function mostrar(lista) {
    var contenedor = document.getElementById("lista-recetas");
    contenedor.innerHTML = "";

    for (var i = 0; i < lista.length; i++) {
        var r = lista[i];
        var img = r.imagen;

        var tarjeta = document.createElement("div");
        tarjeta.className = "tarjeta-receta";
        tarjeta.innerHTML = '<div class="tarjeta-imagen"><img src="' + img + '" alt=""></div>';
        tarjeta.innerHTML += '<h3>' + r.nombre + '</h3>';
        tarjeta.onclick = (function(receta) {
            return function() { abrirModal(receta); };
        })(r);
        contenedor.appendChild(tarjeta);
    }
}

function filtrar() {
    var texto = document.getElementById("buscador").value.toLowerCase();
    var filtradas = [];
    for (var i = 0; i < recetas.length; i++) {
        if (recetas[i].nombre.toLowerCase().indexOf(texto) !== -1) {
            filtradas.push(recetas[i]);
        }
    }
    mostrar(filtradas);
}

function abrirModal(r) {
    document.getElementById("modal-receta").style.display = "flex";
    document.getElementById("img-receta").src = r.imagen;
    document.getElementById("titulo-receta").innerText = r.nombre;
    document.getElementById("desc-receta").innerText = r.descripcion || "";
    document.getElementById("tiempo-receta").innerText = r.tiempo || "?";
    document.getElementById("dificultad-receta").innerText = r.dificultad || "?";

    var ul = document.getElementById("lista-ingredientes");
    ul.innerHTML = "";
    for (var i = 0; i < r.ingredientes.length; i++) {
        ul.innerHTML += "<li>" + r.ingredientes[i].nombre + "</li>";
    }

    var ol = document.getElementById("lista-pasos");
    ol.innerHTML = "";
    for (var i = 0; i < r.pasos.length; i++) {
        ol.innerHTML += "<li>" + r.pasos[i] + "</li>";
    }
}

function cerrarModal() {
    document.getElementById("modal-receta").style.display = "none";
}

document.addEventListener("DOMContentLoaded", function() {
    cargar();
});
</script>

</body>
</html>
