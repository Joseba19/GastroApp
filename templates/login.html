<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <title>Acceso - GastroLab</title>
</head>

<body class="login-body">
    <div class="login-wrapper">
        <div class="login-logo">
            <h1>GastroLab</h1>
            <p>Gestión de recetas y personal</p>
        </div>

        <div class="login-card">
            <h2>Acceso al sistema</h2>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" value="{{ username_prev or '' }}"
                        placeholder="nombre.apellido" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="show-pass-btn">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="toggle-pass" onclick="togglePassword()" title="Mostrar/ocultar">
                            <span id="eye-icon">&#128065;</span>
                        </button>
                    </div>
                </div>

                {% if error %}
                <div class="login-error">
                    <span>&#9888;</span> {{ error }}
                </div>
                {% endif %}

                <button type="submit" class="btn-primary">Entrar</button>
            </form>
        </div>
    </div>
</body>

</html>
